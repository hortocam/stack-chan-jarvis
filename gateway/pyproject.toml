[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-gateway"
version = "0.1.0"
description = "Jarvis Device Gateway — xiaozhi v2.2.4 voice gateway for the StackChan robot"
requires-python = ">=3.11"
dependencies = [
    "aiohttp",
    "av",
    "edge-tts>=7.2",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[tool.setuptools]
packages = ["jarvis_gateway"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "live: needs the real whisper / Hermes / edge-tts services (deselected by default)",
    "slow: long-running loop and soak tests (deselected by default)",
]
addopts = "-m 'not live and not slow'"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
